    <rect x="200" y="225" width="24" height="28"/><rect x="244" y="225" width="24" height="28"/><rect x="288" y="225" width="24" height="28"/><rect x="332" y="225" width="24" height="28"/><rect x="376" y="225" width="24" height="28"/>
    <rect x="200" y="270" width="24" height="28"/><rect x="244" y="270" width="24" height="28"/><rect x="288" y="270" width="24" height="28"/><rect x="332" y="270" width="24" height="28"/><rect x="376" y="270" width="24" height="28"/>
    <rect x="200" y="315" width="24" height="28"/><rect x="244" y="315" width="24" height="28"/><rect x="288" y="315" width="24" height="28"/><rect x="376" y="315" width="24" height="28"/>
    <rect x="200" y="360" width="24" height="28"/><rect x="244" y="360" width="24" height="28"/><rect x="288" y="360" width="24" height="28"/><rect x="332" y="360" width="24" height="28"/><rect x="376" y="360" width="24" height="28"/>
    <rect x="200" y="405" width="24" height="28"/><rect x="244" y="405" width="24" height="28"/><rect x="288" y="405" width="24" height="28"/><rect x="332" y="405" width="24" height="28"/><rect x="376" y="405" width="24" height="28"/>
    <rect x="200" y="450" width="24" height="28"/><rect x="244" y="450" width="24" height="28"/><rect x="288" y="450" width="24" height="28"/><rect x="332" y="450" width="24" height="28"/><rect x="376" y="450" width="24" height="28"/>
