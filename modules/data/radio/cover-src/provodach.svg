  <circle cx="344" cy="329" r="42" fill="#E2B862" opacity="0.07"/>
  <circle cx="344" cy="329" r="27" fill="#E2B862" opacity="0.14"/>
  <rect x="332" y="315" width="24" height="28" fill="#E2B862"/>
