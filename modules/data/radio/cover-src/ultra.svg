<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2874B"/>
      <stop offset="1" stop-color="#F26E74"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="#141617"/>
  <!-- ring -->
  <circle cx="300" cy="300" r="225" fill="none" stroke="#262B2E" stroke-width="3"/>
  <circle cx="300" cy="300" r="212" fill="none" stroke="#1A1D1F" stroke-width="2"/>
  <!-- echo bolt -->
  <polygon points="368,82 208,342 303,342 258,542 448,262 343,262" fill="#65B8C7" opacity="0.30"/>
  <!-- main bolt -->
  <polygon points="350,70 190,330 285,330 240,530 430,250 325,250" fill="url(#bolt)"/>
  <!-- sparks -->
  <g stroke="#F3C775" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="240" x2="172" y2="262"/>
    <line x1="455" y1="330" x2="433" y2="352"/>
    <line x1="380" y1="110" x2="358" y2="132"/>
  </g>
</svg>
