# Everforest Minimal Single-Line (`.theme.md` §4): одна строка,
# палитра noctalia инжектится Noctalia starship-template.
add_newline = false
palette = "noctalia"

format = "$directory$git_branch$git_status$cmd_duration$character"
right_format = "$python$nix_shell$rust$dotnet$nodejs"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "󰘬 "
style = "bold green"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold maroon"

[cmd_duration]
min_time = 3000
format = "[$duration]($style) "
style = "overlay2"

# ── Right prompt: Environments & Languages ──

[python]
symbol = "󰌠 "
style = "bold flamingo"
format = '[\($symbol$virtualenv\)]($style)'
detect_extensions = []
detect_files = []

[nix_shell]
symbol = " "
style = "bold flamingo"
format = '[\($symbol$state\)]($style)'

[rust]
symbol = "󱘗 "
style = "bold flamingo"
format = '[\($symbol$version\)]($style)'

[dotnet]
symbol = "󰌛 "
style = "bold flamingo"
format = '[\($symbol$version\)]($style)'

[nodejs]
symbol = "󰌞 "
style = "bold flamingo"
format = '[\($symbol$version\)]($style)'
