# Everforest Minimal Single-Line (`.theme.md` §4): одна строка,
# палитра noctalia инжектится Noctalia starship-template.
add_newline = false
palette = "noctalia"

format = "$directory$git_branch$git_status$cmd_duration$character"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "󰘬 "
style = "bold green"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold maroon"

[cmd_duration]
min_time = 3000
format = "[$duration]($style) "
style = "overlay2"
